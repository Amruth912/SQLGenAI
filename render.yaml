services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: sqlgenai-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render dashboard
      - key: JDBC_DATABASE_URL
        fromDatabase:
          name: sqlgenai-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: sqlgenai-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: sqlgenai-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: sqlgenai-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: sqlgenai-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: sqlgenai-db
          property: password
      - key: INIT_SAMPLE_DATA
        value: "true"

  # 2. React Frontend Static Site
  - type: web
    name: sqlgenai-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    buildFilter:
      paths:
        - frontend/**

databases:
  # 3. Managed PostgreSQL Database
  - name: sqlgenai-db
    databaseName: sqlgenai_db
    user: sqlgenai
    plan: free
    region: oregon
